name: CI artifact transport contract
on:
  pull_request:
    paths:
      - 'actions/ci-artifact/**'
      - '.github/workflows/ci-artifact-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: [self-hosted, Linux, ARM64, oracle-a1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: python3 -B -m unittest discover -s actions/ci-artifact -p 'test_*.py' -v
      - run: node --test actions/ci-artifact/worker.test.mjs
  live-smoke:
    if: vars.CI_ARTIFACT_PILOT_ENABLED == 'true'
    needs: contract
    permissions:
      contents: read
      id-token: write
    runs-on: [self-hosted, Linux, ARM64, oracle-a1]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify live private storage with short-lived identity
        env:
          CI_ARTIFACT_BROKER_URL: ${{ vars.CI_ARTIFACT_BROKER_URL }}
        run: python3 -B actions/ci-artifact/live_smoke.py
